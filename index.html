
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="World news headlines and updates from news publishers.">
<title>WorldBrief — World News</title>
<style>
:root {
  --ink: #172033;
  --muted: #68758a;
  --blue: #2448a5;
  --line: #e4e9f1;
  --paper: #f5f7fb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
header {
  background: #12213c;
  color: white;
  padding: 25px max(20px, calc((100% - 1100px)/2));
}
.brand { font-size: 27px; font-weight: 800; }
header p { margin: 5px 0 0; color: #d1d9e8; }
main { max-width: 1100px; margin: auto; padding: 24px 18px; }
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
input, select, button {
  font: inherit;
  border: 1px solid #d5dce8;
  border-radius: 9px;
  padding: 11px 13px;
}
input { flex: 1; min-width: 190px; background: white; }
button { cursor: pointer; }
.primary { background: var(--blue); color: white; border: 0; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.tabs button { background: white; }
.tabs button.active { background: var(--blue); color: white; }
.status { color: var(--muted); margin: 18px 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 16px;
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 19px;
  min-width: 0;
}
.meta {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
}
.card h2 { font-size: 19px; line-height: 1.4; margin: 0 0 12px; }
.card p { color: #526077; line-height: 1.65; }
.card a { color: var(--blue); font-weight: 650; }
footer {
  max-width: 1100px;
  margin: auto;
  padding: 10px 18px 35px;
  color: var(--muted);
  font-size: 13px;
}
footer a { color: var(--blue); }
</style>
</head>
<body>
<header>
  <div class="brand">🌍 WorldBrief</div>
  <p>World news. Clear context. Original sources.</p>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search"
      placeholder="Search headlines and summaries..."
      aria-label="Search news">
    <button class="primary" id="refresh">↻ Refresh news</button>
  </div>

  <nav class="tabs" aria-label="News categories">
    <button class="active" data-category="Latest">Latest</button>
    <button data-category="Politics">Politics</button>
    <button data-category="Business">Business</button>
    <button data-category="Technology">Technology</button>
  </nav>

  <p id="status" class="status" role="status">
    Loading news feeds...
  </p>
  <section id="news" class="grid" aria-live="polite"></section>
</main>

<footer>
  Headlines and excerpts are supplied by their respective publishers.
  Please visit the original article for the full report.
  <p>News sources:
    <a href="https://www.bbc.com/news" target="_blank"
       rel="noopener noreferrer">BBC News</a>.
    This independent website is not affiliated with the BBC.
  </p>
</footer>

<script>
const feeds = {
  Latest: [
    ["World", "https://feeds.bbci.co.uk/news/world/rss.xml"],
    ["World", "https://feeds.bbci.co.uk/news/rss.xml"]
  ],
  Politics: [
    ["Politics", "https://feeds.bbci.co.uk/news/politics/rss.xml"]
  ],
  Business: [
    ["Business", "https://feeds.bbci.co.uk/news/business/rss.xml"]
  ],
  Technology: [
    ["Technology", "https://feeds.bbci.co.uk/news/technology/rss.xml"]
  ]
};

// RSS-to-JSON service. No API key is needed for this basic request.
const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";

const news = document.getElementById("news");
const statusText = document.getElementById("status");
const search = document.getElementById("search");
const refresh = document.getElementById("refresh");

let category = "Latest";
let articles = [];
let requestNumber = 0;

function safeDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? "" : date.toLocaleString();
}

function render() {
  const term = search.value.trim().toLowerCase();

  const filtered = articles.filter(item => {
    const text = (item.title + " " + item.summary).toLowerCase();
    return text.includes(term);
  });

  news.replaceChildren();

  if (!filtered.length) {
    const message = document.createElement("p");
    message.textContent = articles.length
      ? "No stories match your search."
      : "No stories loaded. Try refreshing.";
    news.append(message);
    return;
  }

  for (const item of filtered) {
    const card = document.createElement("article");
    card.className = "card";

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = item.source + " · " + safeDate(item.date);

    const title = document.createElement("h2");
    title.textContent = item.title;

    const summary = document.createElement("p");
    summary.textContent = item.summary || "Open the original article for details.";

    const link = document.createElement("a");
    link.href = item.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Read original article ↗";

    card.append(meta, title, summary, link);
    news.append(card);
  }
}

async function loadNews() {
  const myRequest = ++requestNumber;
  refresh.disabled = true;
  statusText.textContent = "Loading news...";
  news.replaceChildren();
  articles = [];

  const selectedFeeds = feeds[category];

  const results = await Promise.allSettled(
    selectedFeeds.map(async ([source, url]) => {
      const endpoint = proxy + encodeURIComponent(url);
      const response = await fetch(endpoint);

      if (!response.ok) throw new Error("Feed request failed");

      const data = await response.json();
      if (data.status !== "ok") throw new Error("Feed unavailable");

      return (data.items || []).map(item => ({
        source,
        title: item.title || "Untitled article",
        link: item.link || "",
        date: item.pubDate || "",
        // Use text, not untrusted publisher HTML.
        summary: (item.description || item.content || "")
          .replace(/<[^>]*>/g, " ")
          .replace(/&nbsp;/gi, " ")
          .replace(/&amp;/gi, "&")
          .replace(/&quot;/gi, '"')
          .replace(/&#39;|&apos;/gi, "'")
          .replace(/&lt;/gi, "<")
          .replace(/&gt;/gi, ">")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 260)
      })).filter(item => {
        try {
          return item.link &&
            new URL(item.link).protocol === "https:" &&
            item.title;
        } catch {
          return false;
        }
      });
    })
  );

  if (myRequest !== requestNumber) return;

  articles = results
    .filter(result => result.status === "fulfilled")
    .flatMap(result => result.value);

  // Remove duplicates by article URL.
  articles = [...new Map(
    articles.map(item => [item.link, item])
  ).values()];

  // Show newest first when publication dates are available.
  articles.sort((a, b) =>
    (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0)
  );

  const failures = results.filter(
    result => result.status === "rejected"
  ).length;

  if (!articles.length) {
    statusText.textContent =
      "News could not be loaded. Check your connection or try again later.";
  } else if (failures) {
    statusText.textContent =
      `Loaded ${articles.length} stories. Some feeds were unavailable.`;
  } else {
    statusText.textContent = `${articles.length} stories loaded · ${category}`;
  }

  render();
  refresh.disabled = false;
}

document.querySelectorAll("[data-category]").forEach(button => {
  button.addEventListener("click", () => {
    category = button.dataset.category;
    document.querySelectorAll("[data-category]").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });
    loadNews();
  });
});

search.addEventListener("input", render);
refresh.addEventListener("click", loadNews);

loadNews();
</script>
</body>
</html>
